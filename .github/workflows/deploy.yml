name: Deploy SkripsiLab AI ke Web Hosting (FTPS TLSv1.2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync Aplikasi & public_html ke Hosting
    runs-on: ubuntu-latest
    env:
      DEPLOY_PUBLIC_FTP_USER: ${{ secrets.FTP_PUBLIC_USERNAME }}
      DEPLOY_PUBLIC_FTP_PASS: ${{ secrets.FTP_PUBLIC_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, pdo_mysql, openssl, curl, zip, gd, fileinfo

      - name: Verifikasi script FTPS sync (unit test)
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Siapkan folder runtime Laravel (non-empty .keep) & daftar exclude
        run: |
          mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs bootstrap/cache
          printf '# keep\n' | tee storage/framework/views/.keep storage/framework/sessions/.keep storage/framework/cache/data/.keep storage/logs/.keep bootstrap/cache/.keep > /dev/null
          rm -f bootstrap/cache/*.php

          cat <<'EOF' > /tmp/app_exclude.txt
          **/.git*
          **/.git*/**
          .github/**
          **/node_modules/**
          **/vendor/**
          vendor/**
          *.zip
          **/tests/**
          **/.env
          **/.env.*
          !.env.example
          _cpanel_public_html/**
          storage/logs/*.log
          storage/framework/sessions/**
          !storage/framework/sessions/.keep
          storage/framework/cache/data/**
          !storage/framework/cache/data/.keep
          storage/framework/views/**
          !storage/framework/views/.keep
          promo_skripsilab_tiktok.mp4
          *.sqlite
          database/*.sqlite
          api/**
          vercel.json
          converter-service/**
          scripts/**
          EOF

      - name: Deploy aplikasi Laravel ke cPanel (FTPS TLSv1.2 + Session Reuse)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 .github/scripts/ftps_sync.py \
            --local-dir "." \
            --server-dir "${{ vars.FTP_SERVER_DIR || '/' }}" \
            --state-name ".ftp-deploy-manifest-app-v3.json" \
            --protocol "${{ vars.FTP_PROTOCOL || 'ftps' }}" \
            --port "${{ vars.FTP_PORT || '21' }}" \
            --exclude-file "/tmp/app_exclude.txt" \
            --clear-views

      - name: Siapkan folder public_html (cPanel Primary Domain)
        if: ${{ env.DEPLOY_PUBLIC_FTP_USER != '' && env.DEPLOY_PUBLIC_FTP_PASS != '' }}
        env:
          CPANEL_APP_DIR: ${{ vars.CPANEL_APP_DIR || 'skripsilabai' }}
        run: |
          rm -rf _cpanel_public_html
          mkdir -p _cpanel_public_html
          cp -R public/. _cpanel_public_html/
          php -r '
            $dir = trim(getenv("CPANEL_APP_DIR") ?: "skripsilabai", "/");
            $php = file_get_contents("public/index.php");
            $php = str_replace(["/../vendor/", "/../bootstrap/"], ["/../{$dir}/vendor/", "/../{$dir}/bootstrap/"], $php);
            if (!str_contains($php, "/../{$dir}/vendor/autoload.php") || !str_contains($php, "/../{$dir}/bootstrap/app.php")) {
                fwrite(STDERR, "Gagal rewrite public_html/index.php\n");
                exit(1);
            }
            file_put_contents("_cpanel_public_html/index.php", $php);
          '
          php -l _cpanel_public_html/index.php
          test -f _cpanel_public_html/.htaccess

          cat <<'EOF' > /tmp/public_exclude.txt
          **/.git*
          .well-known/**
          cgi-bin/**
          error_log
          .user.ini
          EOF

      - name: Deploy public_html ke cPanel (FTPS TLSv1.2 + Session Reuse)
        if: ${{ env.DEPLOY_PUBLIC_FTP_USER != '' && env.DEPLOY_PUBLIC_FTP_PASS != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_PUBLIC_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PUBLIC_PASSWORD }}
        run: |
          python3 .github/scripts/ftps_sync.py \
            --local-dir "./_cpanel_public_html" \
            --server-dir "${{ vars.FTP_PUBLIC_SERVER_DIR || '/' }}" \
            --state-name ".ftp-deploy-manifest-public-v3.json" \
            --protocol "${{ vars.FTP_PROTOCOL || 'ftps' }}" \
            --port "${{ vars.FTP_PORT || '21' }}" \
            --exclude-file "/tmp/public_exclude.txt"
